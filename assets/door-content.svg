<svg xmlns="http://www.w3.org/2000/svg" width="240" height="150" viewBox="0 0 240 150" role="img" aria-label="Content: Beginner Friendly Dev">
  <style>
    @font-face { font-family: Display; src: url(data:font/ttf;base64,); }
    @font-face { font-family: Body; src: url(data:font/ttf;base64,); }
    .card { animation: bob 4.2s 0.7s cubic-bezier(.3,.7,.2,1) infinite; transform-origin: center; }
    .arrow { animation: nudge 4.2s 0.7s ease-in-out infinite; }
    @keyframes bob { 0%, 70%, 100% { transform: translateY(0); } 12% { transform: translateY(-7px); } 24% { transform: translateY(0); } }
    @keyframes nudge { 0%, 70%, 100% { transform: translateX(0); } 12% { transform: translateX(6px); } }
    @media (prefers-reduced-motion: reduce) { .card, .arrow { animation: none; } }
  </style>
  <g class="card">
    <rect x="4" y="10" width="232" height="132" rx="22" fill="#7B3FF2"/>
    <text x="24" y="40" font-family="Body, monospace" font-size="14" fill="#FFFFFF" opacity=".75">03</text>
    <text x="24" y="98" font-family="Display, system-ui, sans-serif" font-size="34" letter-spacing="-1.2" fill="#FFFFFF">Content<tspan class="arrow"> →</tspan></text>
    <text x="24" y="124" font-family="Body, system-ui, sans-serif" font-size="13.5" fill="#FFFFFF" opacity=".85">Beginner Friendly Dev</text>
  </g>
</svg>
